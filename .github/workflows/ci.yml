name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: source and scope (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Compile platform terminal helper from source
        run: node bin/koto.js terminal build

  ide-package:
    name: IDE package (published core)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: plugins/vscode
    env:
      npm_config_fetch_retries: '0'
      npm_config_fetch_timeout: '30000'
      npm_config_maxsockets: '2'
      npm_config_update_notifier: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install isolated extension build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000 --maxsockets=2 --update-notifier=false
      - name: Package the standalone VSIX with the pinned published core
        run: npm run package
      - name: Retain the VSIX and its frozen-core integrity manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koto-ide-vsix-${{ github.sha }}
          path: |
            plugins/vscode/*.vsix
            plugins/vscode/core-integrity.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  required:
    name: CI / required
    if: always()
    needs: [verify, ide-package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require source checks and the packaged IDE delivery
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          IDE_PACKAGE_RESULT: ${{ needs.ide-package.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$IDE_PACKAGE_RESULT" = success
