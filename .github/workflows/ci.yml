name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: source and scope (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Inspect Windows runner directory access (read only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kotoDirectory = node -e "process.stdout.write(require('node:path').join(require('node:os').homedir(), '.koto', 'native'))"
          $kotoIdentity = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          Write-Output "current-user=$kotoIdentity"
          $kotoDepth = 0
          while ($kotoDirectory -and $kotoDepth -lt 32) {
            if (Test-Path -LiteralPath $kotoDirectory) {
              $kotoAcl = Get-Acl -LiteralPath $kotoDirectory
              $kotoOwner = $kotoAcl.GetOwner([System.Security.Principal.SecurityIdentifier]).Value
              Write-Output "depth=$kotoDepth owner=$kotoOwner"
              $kotoAcl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]) | Select-Object -First 128 | ForEach-Object {
                Write-Output "sid=$($_.IdentityReference.Value) type=$($_.AccessControlType) rights=$($_.FileSystemRights) inheritance=$($_.InheritanceFlags) propagation=$($_.PropagationFlags)"
              }
            } else { Write-Output "depth=$kotoDepth missing=true" }
            $kotoParent = [System.IO.Directory]::GetParent($kotoDirectory)
            if ($null -eq $kotoParent) { break }
            $kotoDirectory = $kotoParent.FullName
            $kotoDepth += 1
          }
      - name: Compile platform terminal helper from source
        run: node bin/koto.js terminal build

  required:
    name: CI / required
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform and Node version
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
