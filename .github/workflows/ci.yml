name: Temporary reviewed Windows Qwen3 4B observation

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [idle, controls, observe, integrate]
        required: true
      runner:
        type: choice
        options: [windows-2022]
        required: true
      candidate:
        description: Exact reviewed 40-character candidate commit
        type: string
        required: true
      observation_id:
        description: Unique lowercase id, 8-48 characters; reuse only for its integration stage
        type: string
        required: true
      source_run:
        description: Integration only; successful immutable stage-one artifact's run id
        type: string
      artifact_id:
        description: Integration only; exact immutable artifact id
        type: string
      artifact_digest:
        description: Integration only; sha256-prefixed digest from artifact metadata
        type: string
      bundle_sha256:
        description: Integration only; reviewed rehydration.zip SHA-256
        type: string
      review_token:
        description: Integration only; exact contributor token reviewed by the operator
        type: string
      reviewed_settings:
        description: Exact reviewed settings JSON, including true Mac and Linux evidence attestations; no defaults
        type: string
        required: true
      settings_sha256:
        description: SHA-256 of the exact reviewed_settings UTF-8 bytes
        type: string
        required: true

permissions:
  contents: read
  actions: read

# Both operating systems and both stages are deliberately serialized.
concurrency:
  group: temporary-native-product-observation
  cancel-in-progress: false

jobs:
  observation:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      OBS_EXECUTION: windows-actions
      OBS_OPERATION: ${{ inputs.operation }}
      OBS_RUNNER: ${{ inputs.runner }}
      OBS_CANDIDATE: ${{ inputs.candidate }}
      OBS_ID: ${{ inputs.observation_id }}
      OBS_SOURCE_RUN: ${{ inputs.source_run }}
      OBS_ARTIFACT_ID: ${{ inputs.artifact_id }}
      OBS_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
      OBS_BUNDLE_SHA: ${{ inputs.bundle_sha256 }}
      OBS_REVIEW_TOKEN: ${{ inputs.review_token }}
      OBS_SETTINGS_SHA: ${{ inputs.settings_sha256 }}
      OBS_SETTINGS_TEXT: ${{ inputs.reviewed_settings }}
      OBS_CANDIDATE_DIRECTORY: ${{ github.workspace }}/candidate
      OBS_DOWNLOAD_DIRECTORY: ${{ github.workspace }}/native-stage-one
    steps:
      - name: Preserve exact Git bytes before either checkout
        run: |
          # This setting belongs only to this disposable Windows runner.
          # Apply it before checkout; changing it afterward leaves CRLF files intact.
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Read the explicitly dispatched temporary driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - name: Read the exact reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: Verify both checkout payloads and the pinned public key before preparation
        run: |
          python - <<'PYBYTES'
          import hashlib, json, os, pathlib, re, subprocess
          workspace=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          def git(root,*args):
              result=subprocess.run(['git',*args],cwd=root,check=True,capture_output=True,timeout=15)
              if len(result.stdout)>2*1024**2 or len(result.stderr)>65536:
                  raise SystemExit('checkout_git_output_bound')
              return result.stdout
          summaries=[]
          for name,revision in [('driver',os.environ['GITHUB_SHA']),('candidate',os.environ['OBS_CANDIDATE'])]:
              if not re.fullmatch(r'[a-f0-9]{40}',revision): raise SystemExit('checkout_revision_invalid')
              root=workspace/name
              if git(root,'rev-parse','HEAD').decode().strip()!=revision: raise SystemExit('checkout_revision_changed')
              entries=git(root,'ls-tree','-r','-z',revision).split(b'\0')
              if len(entries)>10001: raise SystemExit('checkout_file_count_bound')
              total=0; inventory=[]
              for entry in filter(None,entries):
                  meta,rawpath=entry.split(b'\t',1); mode,kind,oid=meta.split()
                  relative=rawpath.decode('utf-8'); path=root/relative
                  if mode not in [b'100644',b'100755'] or kind!=b'blob' or path.is_symlink() or not path.is_file():
                      raise SystemExit('checkout_regular_file_required')
                  size=path.stat().st_size; total+=size
                  if size>8*1024**2 or total>128*1024**2: raise SystemExit('checkout_byte_bound')
                  data=path.read_bytes()
                  actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                  if actual!=oid.decode():
                      print(json.dumps({'error':'checkout_blob_bytes_changed','checkout':name,'path':relative,
                                        'expectedGitBlob':oid.decode(),'actualGitBlob':actual,'bytes':len(data),
                                        'crlfCount':data.count(b'\r\n')}))
                      raise SystemExit('checkout_blob_bytes_changed')
                  inventory.append([relative,actual,hashlib.sha256(data).hexdigest()])
              summaries.append({'checkout':name,'revision':revision,'files':len(inventory),'bytes':total,
                                'payloadInventorySha256':hashlib.sha256(json.dumps(inventory,separators=(',',':')).encode()).hexdigest(),
                                'coreAutocrlf':git(root,'config','--get','core.autocrlf').decode().strip(),
                                'coreEol':git(root,'config','--get','core.eol').decode().strip()})
          public_key=(workspace/'driver/.github/manual-native-4b/evidence-public.pem').read_bytes()
          key_summary={'bytes':len(public_key),'sha256':hashlib.sha256(public_key).hexdigest(),'crlfCount':public_key.count(b'\r\n')}
          print(json.dumps({'checkoutByteVerification':summaries,'evidencePublicKey':key_summary},sort_keys=True))
          if key_summary['sha256']!='f69f2874d13ae977b48e2947dc7ef1004079dee5e0f6bcf35152cec12755a31f':
              raise SystemExit('evidence_public_key_changed')
          PYBYTES
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Bind exact reviewed settings before any acquisition
        run: |
          python - <<'PYSETTINGS'
          import hashlib, os, pathlib, re
          raw=os.environ['OBS_SETTINGS_TEXT'].encode('utf-8')
          expected=os.environ['OBS_SETTINGS_SHA']
          if len(raw)>65536 or not re.fullmatch(r'[a-f0-9]{64}',expected) or hashlib.sha256(raw).hexdigest()!=expected:
              raise SystemExit('reviewed settings bytes do not match')
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'koto-4b-reviewed-settings.json'
          with target.open('xb') as f: f.write(raw)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('OBS_SETTINGS_FILE='+str(target)+'\n')
          PYSETTINGS
          node driver/.github/manual-native-4b/reviewed-settings.mjs validate "$RUNNER_TEMP/koto-4b-reviewed-settings.json" "$OBS_SETTINGS_SHA" "$OBS_CANDIDATE" > /dev/null
      - name: Acquire pinned assets and install the exact package (idle/controls acquire no model or runtime)
        if: inputs.operation == 'observe' || inputs.operation == 'idle' || inputs.operation == 'controls'
        run: python driver/.github/manual-native-4b/bundle.py prepare
      - name: One bounded native startup and controls diagnosis without a model
        if: inputs.operation == 'idle'
        run: node driver/.github/manual-native-4b/observe-idle.mjs "$OBS_ROOT/idle-bindings.json"
      - name: One bounded actual native-agent observation, ending at review
        if: inputs.operation == 'observe'
        run: node driver/.github/manual-native-4b/observe.mjs
      - name: Verify the approved immutable artifact identity
        if: inputs.operation == 'integrate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python driver/.github/manual-native-4b/bundle.py verify-reference
      - name: Download that artifact without running any agents
        if: inputs.operation == 'integrate'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ env.OBS_DOWNLOAD_DIRECTORY }}
          merge-multiple: true
      - name: Restore exact file bytes at the original paths, then install the same package
        if: inputs.operation == 'integrate'
        run: python driver/.github/manual-native-4b/bundle.py restore
      - name: Integrate only the separately reviewed unchanged token
        if: inputs.operation == 'integrate'
        run: node driver/.github/manual-native-4b/integrate.mjs
      - name: Observe actual Windows CLI controls with one idle native terminal
        if: success() && (inputs.operation == 'observe' || inputs.operation == 'controls')
        run: |
          node driver/.github/manual-native-4b/observe-cli-controls.mjs \
            driver/.github/manual-native-4b/cli-controls-bindings.json \
            driver/.github/manual-native-4b
      - name: Retain public state and all private evidence separately
        if: always() && env.OBS_ROOT != ''
        run: python driver/.github/manual-native-4b/bundle.py seal
      - name: Encrypt private native output with the operator's public key
        if: always() && env.OBS_ROOT != ''
        run: node driver/.github/manual-native-4b/envelope.mjs "$OBS_ROOT/raw-evidence.tar" driver/.github/manual-native-4b/evidence-public.pem "$OBS_ROOT/out/raw-evidence.enc"
      - name: Upload only public rehydration data and encrypted raw evidence
        if: always() && env.OBS_ROOT != ''
        id: retained
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-4b-${{ inputs.observation_id }}-${{ inputs.runner }}
          path: |
            ${{ env.OBS_ROOT }}/out/receipt.json
            ${{ env.OBS_ROOT }}/out/rehydration.zip
            ${{ env.OBS_ROOT }}/out/raw-evidence.enc
            ${{ env.OBS_ROOT }}/out/raw-evidence.enc.json
          if-no-files-found: error
          retention-days: 7
