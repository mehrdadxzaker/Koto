{
  "name": "Bug report",
  "description": "Report a core, CLI or delivered integration defect.",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Use synthetic examples. Keep credentials, private workflows, prompts and responses out of public reports."
      }
    },
    {
      "type": "textarea",
      "id": "details",
      "attributes": {
        "label": "Details",
        "description": "What happened, what did you expect, and how can it be reproduced with synthetic inputs?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "environment",
      "attributes": {
        "label": "Environment",
        "description": "Koto revision, Node/npm versions and operating system."
      }
    }
  ]
}
