{
  "name": "Installation problem",
  "description": "Report npm/npx installation or execution problems.",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Use synthetic examples. Keep credentials, private workflows, prompts and responses out of public reports."
      }
    },
    {
      "type": "textarea",
      "id": "details",
      "attributes": {
        "label": "Details",
        "description": "Which npm/npx command failed? Include the Node and npm versions, OS, package revision and sanitized error."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "environment",
      "attributes": {
        "label": "Environment",
        "description": "Koto revision, Node/npm versions and operating system."
      }
    }
  ]
}
