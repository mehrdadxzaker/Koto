{
  "name": "Feature request",
  "description": "Improve the orchestration core, CLI, IDE plugins or Koto UI.",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Use synthetic examples. Keep credentials, private workflows, prompts and responses out of public reports."
      }
    },
    {
      "type": "textarea",
      "id": "details",
      "attributes": {
        "label": "Details",
        "description": "Which allowed product component should change, what should users be able to do, and how would success be checked?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "environment",
      "attributes": {
        "label": "Environment",
        "description": "Koto revision, Node/npm versions and operating system."
      }
    }
  ]
}
